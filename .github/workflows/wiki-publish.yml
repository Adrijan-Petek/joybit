name: Publish Documentation to Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/wiki/**'
      - '.github/workflows/wiki-publish.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Adrijan-Petek' # Only run on main repo
    env:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      WIKI_SOURCE_PATH: .wiki-publish
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare wiki content
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WIKI_SOURCE_PATH"
          mkdir -p "$WIKI_SOURCE_PATH"

          if [ -d "docs/wiki" ]; then
            cp -R docs/wiki/. "$WIKI_SOURCE_PATH/"
            echo "Prepared wiki content from docs/wiki"
          elif [ -f "README.md" ]; then
            cp README.md "$WIKI_SOURCE_PATH/Home.md"
            echo "Prepared wiki content from README.md fallback"
          else
            echo "No wiki source content found"
            echo "HAS_WIKI_SOURCE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$(find "$WIKI_SOURCE_PATH" -maxdepth 1 -type f | head -n 1)" ]; then
            echo "No publishable wiki files found"
            echo "HAS_WIKI_SOURCE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "HAS_WIKI_SOURCE=true" >> "$GITHUB_ENV"

      - name: Skip when wiki token is missing
        if: env.GH_PERSONAL_ACCESS_TOKEN == ''
        run: echo "Skipping wiki publish because GH_PERSONAL_ACCESS_TOKEN is not configured."

      - name: Publish Documentation to Wiki
        if: env.HAS_WIKI_SOURCE == 'true' && env.GH_PERSONAL_ACCESS_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          WIKI_REPO="https://x-access-token:${GH_PERSONAL_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          WIKI_WORKDIR="$(mktemp -d)"

          git clone "$WIKI_REPO" "$WIKI_WORKDIR"

          find "$WIKI_WORKDIR" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -R "$WIKI_SOURCE_PATH"/. "$WIKI_WORKDIR"/

          cd "$WIKI_WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No wiki changes to publish"
            exit 0
          fi

          git add -A
          git commit -m "Automatically publish wiki"
          git push origin HEAD:master
